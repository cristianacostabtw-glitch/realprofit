services:
  - type: web
    name: realprofit
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 12 --timeout 90 --graceful-timeout 30 --max-requests 800 --max-requests-jitter 100
    envVars:
      - key: MP_CLIENT_ID
        sync: false
      - key: MP_CLIENT_SECRET
        sync: false
      - key: MP_REDIRECT_URI
        sync: false
      - key: SECRET_KEY
        generateValue: true
