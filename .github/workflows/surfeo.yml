name: surfeo
# Dispara el surfeo de presupuesto de RealProfit. El servidor decide si toca una revision
# (11:00 a 21:30 cada 1 h 30 + reseteo 22:30, hora Argentina); si no toca, no hace nada.
on:
  schedule:
    - cron: "*/10 13-23 * * *"
    - cron: "*/10 0-2 * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: tick
        run: curl -sS -m 400 https://www.realprofitapp.com/surf-tick || true
